name: media_streaming_platform
description: Online ve offline çalışabilen kapsamlı sosyal etkileşimli dijital yayın platformu
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^1.10.0
  video_player: ^2.7.0
  just_audio: ^0.9.0
  sqflite: ^2.3.0
  shared_preferences: ^2.2.0
  get: ^4.6.0
  provider: ^6.0.0
  http: ^1.1.0
  json_annotation: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
